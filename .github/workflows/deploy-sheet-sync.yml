# main に入ったら Function sheetSync (シートと Firestore の 5 分おきの同期) だけをデプロイする (D-0056)。
#
# sheetSync はリポジトリの src/ から写す functions/lib だけで動くので CI で出せる。
# Function api は手元にしか無い辞書データ (functions/private/) を同梱して出すため、
# ここで出すと辞書の無い版で本番を上書きしてしまう。api は今までどおり手元の `nr deploy`。
#
# 中身が前回と同じなら firebase が «変更なし» で飛ばすので、paths で絞らず毎回流す
# (絞ると functions/lib に写す src/ のファイルを足したときに漏れる)。
#
# 必要な設定: Hosting と同じ Secrets の FIREBASE_SERVICE_ACCOUNT_ANOZ_MEMOSUPO。
# そのサービスアカウントに Functions を出すロールが要る。手順は docs/deploy.md。
name: Deploy sheetSync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sheet-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - run: npm ci

      # sheetSync が使う同期・rankey のテスト。落ちたら出さない
      - name: Test
        run: npx vitest run src/__tests__/sheet-bisync.test.js

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Bundle shared modules into functions/lib
        run: bash scripts/sync-functions-lib.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANOZ_MEMOSUPO }}

      # --force: Artifact Registry の古いイメージを消す設定を聞かれても止まらないように
      - name: Deploy sheetSync
        run: >-
          npx --yes firebase-tools@15.22.4 deploy
          --only functions:sheetSync
          --project anoz-memosupo
          --non-interactive --force
