<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>語呂 999 — 画像コンソール</title>
    <style>
      :root {
        --bg: #14161a;
        --card: #1e2127;
        --text: #e6e8ea;
        --text2: #9aa0a6;
        --green: #3fb950;
        --grey: #565b63;
        --amber: #d29922;
        --red: #e5534b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        background: var(--bg);
        padding: 12px 16px;
        border-bottom: 1px solid #2a2e35;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      .filters button {
        background: var(--card);
        color: var(--text);
        border: 1px solid #2a2e35;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 13px;
      }
      .filters button.active {
        border-color: var(--green);
        color: var(--green);
      }
      .stats {
        color: var(--text2);
        font-size: 13px;
        margin-left: auto;
      }
      .readonly-note {
        color: var(--amber);
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
        padding: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid #313640;
        border-radius: 10px;
        padding: 0 8px 8px;
        overflow: hidden;
      }
      .card-num {
        font-weight: 800;
        font-size: 16px;
        letter-spacing: 1px;
        color: var(--text);
        text-align: center;
        background: #2a2f38;
        margin: 0 -8px 8px;
        padding: 5px 0;
      }
      .slot {
        margin-bottom: 8px;
        padding-bottom: 8px;
      }
      /* 同じ数字グループ内の w1/w2 を区切る */
      .slot:not(:last-child) {
        border-bottom: 1px dashed #313640;
      }
      .thumb {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 6px;
        background: #0d0f12 center/cover no-repeat;
        border: 2px solid transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--grey);
        font-size: 12px;
        overflow: hidden;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .thumb.flagged {
        border-color: var(--amber);
      }
      .slot-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        margin-top: 4px;
      }
      .badge {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      .b-has {
        background: var(--green);
      }
      .b-missing {
        background: var(--grey);
      }
      .b-flagged {
        background: var(--amber);
      }
      .b-error {
        background: var(--red);
      }
      .word {
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
        padding: 2px 4px;
        margin-left: 6px;
      }
      .icon-btn:first-of-type {
        margin-left: auto;
      }
      .icon-btn:disabled {
        cursor: default;
      }
      .thumb.kept {
        border-color: var(--green);
      }
      /* 未確定 = 画像はあるが未ロック */
      .thumb.unconfirmed {
        border-color: #3d4350;
        border-style: dashed;
      }
      .unconfirmed-tag {
        position: absolute;
        top: 4px;
        left: 4px;
        background: rgba(210, 153, 34, 0.95);
        color: #14161a;
        font-size: 10px;
        font-weight: 800;
        padding: 1px 5px;
        border-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>語呂 999 画像コンソール</h1>
      <div class="filters" id="filters"></div>
      <div class="stats" id="stats"></div>
    </header>
    <div class="grid" id="grid"></div>
    <script src="./app.js"></script>
  </body>
</html>
