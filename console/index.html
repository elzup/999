<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>語呂 999 — 画像コンソール</title>
    <style>
      :root {
        --bg: #0b0c10;
        --surface: #16181f;
        --surface2: #1e212a;
        --hover: #272b36;
        --line: rgba(255, 255, 255, 0.08);
        --line2: rgba(255, 255, 255, 0.14);
        --text: #eceef2;
        --text2: #9aa1ad;
        --muted: #6b7280;
        --green: #34d399;
        --green-dim: rgba(52, 211, 153, 0.16);
        --amber: #fbbf24;
        --amber-dim: rgba(251, 191, 36, 0.16);
        --red: #f87171;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'Hiragino Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(11, 12, 16, 0.85);
        backdrop-filter: blur(12px);
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.3px;
        margin: 0;
      }
      .filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .filters button {
        background: transparent;
        color: var(--text2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 13px;
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 600;
        transition: all 0.15s;
      }
      .filters button:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .filters button.active {
        background: var(--text);
        border-color: var(--text);
        color: var(--bg);
      }
      .stats {
        color: var(--text2);
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        margin-left: auto;
      }
      /* Triple toggle = segmented control */
      .tri-switch {
        display: inline-flex;
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px;
        gap: 2px;
      }
      .tri-seg {
        background: transparent;
        color: var(--text2);
        border: none;
        border-radius: 999px;
        padding: 5px 13px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s;
      }
      .tri-seg:not(.auto):hover {
        color: var(--text);
      }
      .tri-seg.active {
        background: var(--green);
        color: #07140e;
        font-weight: 700;
      }
      .tri-seg.auto {
        cursor: default;
      }
      .tri-seg.auto.active {
        background: var(--amber);
        color: #1a1304;
      }
      .readonly-note {
        color: var(--amber);
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        gap: 14px;
        padding: 18px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 10px;
        box-shadow: var(--shadow);
        transition: border-color 0.15s;
      }
      .card:hover {
        border-color: var(--line2);
      }
      .card-num {
        font: 700 12px ui-monospace, 'SF Mono', Menlo, monospace;
        letter-spacing: 1px;
        color: var(--text2);
        padding: 2px 2px 8px;
      }
      .slot {
        margin-bottom: 10px;
      }
      .slot:last-child {
        margin-bottom: 2px;
      }
      .thumb {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 12px;
        background: #0d0f14;
        border: 2px solid transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        overflow: hidden;
        transition: transform 0.12s;
      }
      .thumb:active {
        transform: scale(0.985);
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .thumb.kept {
        border-color: var(--green);
      }
      .thumb.unconfirmed {
        border-color: var(--amber);
      }
      .thumb.flagged {
        border-color: var(--red);
        border-style: dashed;
      }
      .slot-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        margin-top: 7px;
      }
      .badge {
        display: none;
      }
      .word {
        color: var(--text);
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .slot-stat {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        padding: 2px 8px;
        border-radius: 999px;
        flex: none;
        white-space: nowrap;
      }
      .slot-stat.is-unconf {
        background: var(--amber-dim);
        color: var(--amber);
      }
      .slot-stat.is-kept {
        background: var(--green-dim);
        color: var(--green);
      }
      /* 操作ボタン */
      .slot-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .act-btn {
        flex: 1 1 0;
        min-width: 40px;
        min-height: 38px;
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.13s;
      }
      .act-btn:hover {
        background: var(--hover);
        border-color: var(--line2);
      }
      .act-btn:active {
        transform: scale(0.97);
      }
      .act-btn.primary {
        flex-basis: 100%;
        background: var(--green-dim);
        border-color: rgba(52, 211, 153, 0.4);
        color: var(--green);
      }
      .act-btn.primary:hover {
        background: rgba(52, 211, 153, 0.24);
      }
      /* 2択チューザー */
      .choose-title {
        font-size: 12px;
        font-weight: 700;
        text-align: center;
        margin: 2px 0 8px;
        color: var(--amber);
      }
      .choose-opt {
        margin-bottom: 8px;
      }
      .choose-opt img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 12px;
        display: block;
        margin-bottom: 5px;
      }
      .choose-opt .act-btn {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>語呂 999 画像コンソール</h1>
      <div class="filters" id="filters"></div>
      <div class="lockview" id="lockview"></div>
      <div class="stats" id="stats"></div>
    </header>
    <div class="grid" id="grid"></div>
    <script src="./app.js"></script>
  </body>
</html>
